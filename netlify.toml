[build]
  command = "npm run build"
  publish = ".next"

[build.environment]
  NODE_VERSION = "22"

# Google Analytics 4 solo en producción, así los deploy previews no suman visitas.
# El ID de medición es público (queda en el HTML), no es un secreto.
[context.production.environment]
  NEXT_PUBLIC_GA_ID = "G-BTV88Z86MW"

# Cache largo para las imágenes, la fuente y el PDF
[[headers]]
  for = "/img/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
